{% extends "base.html" %}

{% block content %}

<form action="/view_book" method="POST" class="mb-3">
    <input type="number" name="book_id" class="form-control" placeholder="ID książki" required>
    <button class="btn btn-dark mt-2">Czytaj</button>
</form>

<h2>{{ title }}</h2>

<p class="book-content">{{ content }}</p>

<p>Strona {{ page + 1 }} / {{ total_pages }}</p>

<div class="d-flex gap-2">
    <form action="/prev" method="POST">
        <button class="btn btn-secondary">←</button>
    </form>

    <form action="/next" method="POST">
        <button class="btn btn-secondary">→</button>
    </form>
</div>

<form action="/page" method="POST" class="mt-3">
    <input type="number" name="page" class="form-control" placeholder="Enter page number" required>
    <button class="btn btn-info mt-2">Go to</button>
</form>

{% endblock %}
